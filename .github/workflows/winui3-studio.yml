name: WinUI 3 modern studio validation

on:
  push:
    branches: [feature/winui3-modern-studio]
    tags: ['studio-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test:
    name: Native Windows x64 build and GUI smoke
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate existing engine and local CLI adapter
        run: |
          Push-Location source
          go test -count=1 ./... 2>&1 | Tee-Object ../engine-test.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          go vet ./...
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          New-Item -ItemType Directory -Force -Path ../publish | Out-Null
          go build -trimpath -o ../publish/Kentro_Engine.exe ./cmd/bridge
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location
          $reply = & ./publish/Kentro_Engine.exe version | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $reply.type -ne 'result') { throw 'CLI bridge version smoke failed' }
          $list = & ./publish/Kentro_Engine.exe list | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $list.type -ne 'result') { throw 'CLI bridge list smoke failed' }
      - name: Publish native unpackaged self-contained WinUI 3 application
        run: |
          dotnet publish studio/Kentro.Studio.csproj --configuration Release --runtime win-x64 --self-contained true -p:Platform=x64 --output publish 2>&1 | Tee-Object studio-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(-not (Test-Path publish/Kentro_Programmatismou.exe)) { throw 'New native EXE missing' }
          if(-not (Test-Path publish/Kentro_Engine.exe)) { throw 'Backend adapter missing' }
      - name: Launch modern UI on a real Windows runner
        run: |
          ./ci/studio-smoke.ps1
      - name: Package complete WinUI app + Go engine inside ONE Windows EXE
        run: |
          New-Item -ItemType Directory -Force source/cmd/onefile,single | Out-Null
          Compress-Archive -Path publish/* -DestinationPath source/cmd/onefile/payload.zip -CompressionLevel Optimal
          Copy-Item packaging/onefile-launcher.go.txt source/cmd/onefile/main.go
          Push-Location source
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../single/Kentro_Programmatismou.exe ./cmd/onefile
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location
          $exe = 'single/Kentro_Programmatismou.exe'
          if(-not (Test-Path $exe)) { throw 'One-file executable was not produced' }
          if((Get-Item $exe).Length -lt 50000000) { throw 'One-file executable does not contain full application payload' }
          "ONEFILE_BYTES=$((Get-Item $exe).Length)" | Tee-Object -FilePath studio-onefile-build.log
          "ONEFILE_SHA256=$((Get-FileHash -Algorithm SHA256 $exe).Hash)" | Tee-Object -FilePath studio-onefile-build.log -Append
      - name: Test standalone EXE on Windows (first launch and cached launch)
        run: |
          ./ci/studio-onefile-smoke.ps1
      - name: Store diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-diagnostics
          path: |
            engine-test.log
            studio-build.log
            studio-smoke.log
            studio-screenshot.png
            studio-onefile-build.log
            studio-onefile-smoke.log
          if-no-files-found: warn
      - name: Publish single verified Windows EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Kentro_Programmatismou_One_EXE
          path: single/Kentro_Programmatismou.exe
          if-no-files-found: error

      - name: Publish versioned GitHub release only after all tests succeed
        if: success() && startsWith(github.ref, 'refs/tags/studio-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "./single/Kentro_Programmatismou.exe" --repo "${{ github.repository }}" --title "Κέντρο Προγραμματισμού · ${{ github.ref_name }}" --generate-notes --verify-tag
