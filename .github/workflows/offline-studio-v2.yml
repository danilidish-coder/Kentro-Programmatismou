name: Offline Studio V2 — full Windows acceptance plus install, upgrade, uninstall
on:
  push:
    branches: [feature/offline-studio-v2-installer]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  complete_windows_validation:
    name: All offline toolchains + native GUI + installed Windows Setup acceptance
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout fresh standalone source
        uses: actions/checkout@v4
      - name: Setup Python for packaging portable interpreter
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Go for packaging portable compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Setup .NET SDK for WPF and offline build
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Setup Node for offline JavaScript testing
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FAST Windows WPF compile before multi-gigabyte runtime packaging
        run: |
          dotnet build Studio/Studio.csproj -c Release -r win-x64 --self-contained false /p:PublishSingleFile=false /p:EnableCompressionInSingleFile=false 2>&1 | Tee-Object studio-quick-compile.log
          if($LASTEXITCODE -ne 0){throw 'Early WPF compilation failed — do not package tools'}
      - name: Install pinned Python build and project dependencies INTO bundled interpreter
        run: |
          python -m pip install --no-cache-dir --disable-pip-version-check "PyInstaller==6.16.0" "PySide6==6.9.3" "python-docx==1.2.0" "openpyxl==3.1.5" "Pillow==11.3.0" "pytest==8.4.2" "psutil==7.1.0" "requests==2.32.5"
          if($LASTEXITCODE -ne 0){throw 'Bundled Python libraries unavailable'}
          python -c "import PySide6.QtWidgets,PyInstaller,openpyxl,docx,PIL,pytest;print('ALL_PYTHON_PACKAGES_PRESENT')"
          if($LASTEXITCODE -ne 0){throw 'Missing bundled Python library'}
      - name: Restore cached portable toolchains (no repeated full download)
        id: tools-cache
        uses: actions/cache/restore@v4
        with:
          path: Studio/Assets/toolchains.zip
          key: studio-v2-portable-py312-go125-dotnet8-node22-20261013-c
      - name: Package complete portable toolchains within application (no admin / no internet at user PC)
        if: steps.tools-cache.outputs.cache-hit != 'true'
        run: |
          ./ci/package-runtime.ps1
      - name: Save portable toolchains before running tests
        if: steps.tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: Studio/Assets/toolchains.zip
          key: studio-v2-portable-py312-go125-dotnet8-node22-20261013-c
      - name: Build new WPF desktop application as one self-contained EXE
        run: |
          dotnet publish Studio/Studio.csproj -c Release -r win-x64 --self-contained true --output publish /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true 2>&1 | Tee-Object studio-build.log
          if($LASTEXITCODE -ne 0){throw 'WPF compile failed'}
          $files=Get-ChildItem publish -File
          $exe=Join-Path (Resolve-Path publish) 'Kentro_Programmatismou.exe'
          if(-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 150000000){throw 'Toolchain payload missing from EXE'}
          "FILE_COUNT=$($files.Count)" | Add-Content studio-build.log
          "EXE_SIZE=$((Get-Item $exe).Length)" | Add-Content studio-build.log
      - name: REAL OFFLINE acceptance — fresh extraction, bundled libraries, GUI, code versions, parallel and sequential tests, approval gate and PySide6 EXE
        run: |
          $ErrorActionPreference='Stop'
          $success=Join-Path $env:TEMP 'kentro-v2-ci-success.txt'
          $failure=Join-Path $env:TEMP 'kentro-v2-ci-failure.txt'
          Remove-Item $success,$failure -Force -ErrorAction SilentlyContinue
          $env:PIP_NO_INDEX='1'
          $env:GOPROXY='off'
          $env:DOTNET_CLI_TELEMETRY_OPTOUT='1'
          $proc=Start-Process -FilePath (Resolve-Path 'publish/Kentro_Programmatismou.exe') -ArgumentList '--ci-selftest' -PassThru -Wait -WorkingDirectory (Resolve-Path 'publish')
          if(Test-Path $failure){Get-Content $failure | Tee-Object -FilePath studio-qa-failure.log}
          if(Test-Path (Join-Path $env:TEMP 'kentro-v2-ci-results.log')) {
            Copy-Item (Join-Path $env:TEMP 'kentro-v2-ci-results.log') studio-qa-results.log
            Get-Content studio-qa-results.log | Select-Object -Last 90
          }
          if($proc.ExitCode -ne 0 -or -not(Test-Path $success)){throw "Real local WPF acceptance failed: exit=$($proc.ExitCode)"}
          Get-Content $success
          Copy-Item (Join-Path $env:TEMP 'kentro-v2-wpf.png') studio-wpf.png
          if((Get-Item studio-wpf.png).Length -lt 10000){throw 'WPF screenshot not captured'}
      - name: Recheck no outside toolchain used during actual local acceptance
        run: |
          $log=Get-Content studio-qa-results.log -Raw
          foreach($word in @('PASS: Bundled Python dependencies actually import on Windows','PASS: Bundled .NET SDK executes offline','PASS: Bundled Go compiler executes offline','PASS: Bundled Node executes offline','PASS: Actual WPF main window binds files and plan','PASS: All four Greek tab captions visible and at least 4.5:1 contrast in every selected/unselected state','PASS: Parallel and sequential stress actually executed','PASS: Mismatched review rejected by engine','PASS: Exact synthetic reviewer decision enables only matching build','PASS: Real PyInstaller onefile EXE built with BUNDLED runtime on Windows','PASS: Real desktop GUI executable launched and remained open','PASS: Local history detects actual file changes','PASS: Unsafe ZIP traversal is rejected','ALL V2 WINDOWS TESTS PASSED')){
            if(-not($log.Contains($word))){throw "Missing Windows acceptance proof: $word"}
          }
          "Windows acceptance markers PASS" | Tee-Object -FilePath studio-final-verification.log
      - name: Compile self-contained Windows Setup using Inno Setup 6
        run: |
          $ErrorActionPreference='Stop'
          $compiler=Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if(-not(Test-Path -LiteralPath $compiler)){
            choco install innosetup --yes --no-progress --limit-output
            if($LASTEXITCODE -ne 0){throw "Inno Setup compiler unavailable (exit=$LASTEXITCODE)"}
          }
          if(-not(Test-Path -LiteralPath $compiler)){throw "Inno Setup compiler is not installed"}
          & $compiler '/Qp' 'installer/Kentro_Programmatismou.iss' 2>&1 | Tee-Object installer-compile.log
          if($LASTEXITCODE -ne 0){throw "Setup compilation failed (exit=$LASTEXITCODE)"}
          $setup='installer-output/Kentro_Programmatismou_Setup_v2.0.1.exe'
          if(-not(Test-Path $setup) -or (Get-Item $setup).Length -lt 150000000){throw "Installer missing application payload"}
          Get-FileHash -Path $setup -Algorithm SHA256 | Format-List | Out-String | Tee-Object -FilePath installer-setup-sha256.log
      - name: REAL user-level Windows acceptance — install, GUI open, same-version upgrade, uninstall, project data retained
        run: |
          ./ci/test-installer.ps1
          if(-not(Test-Path installer-windows-qa.log)){throw 'Real installer tests did not emit report'}
          $testReport=Get-Content installer-windows-qa.log -Raw
          foreach($proof in @('PASS: first-install EXE installed','PASS: Installed GUI starts','PASS: in-place-upgrade EXE installed','PASS: In-place upgrade creates ONE Windows uninstall entry','PASS: Uninstall removes program executable','PASS: after-uninstall - exact SHA256 project data preserved','ALL INSTALLER WINDOWS TESTS PASSED')){
            if(-not $testReport.Contains($proof)){throw "Installer report missing proof: $proof"}
          }
      - name: Upload detailed diagnostics for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-studio-v2-windows-qa
          path: |
            studio-quick-compile.log
            studio-build.log
            studio-qa-results.log
            studio-qa-failure.log
            studio-wpf.png
            studio-final-verification.log
            runtime-package.log
            installer-compile.log
            installer-setup-sha256.log
            installer-windows-qa.log
          if-no-files-found: warn
      - name: Publish ONE fully validated Windows Installer EXE as prerelease
        if: success() && github.ref == 'refs/heads/feature/offline-studio-v2-installer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha="${{ github.sha }}".Substring(0,12)
          $tag="offline-studio-v2-installer-$sha"
          gh release create $tag './installer-output/Kentro_Programmatismou_Setup_v2.0.1.exe' --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Κέντρο Προγραμματισμού · εγκατάσταση Windows v2.0.1 · $sha" --notes "Εγκαταστάτης Windows χωρίς δικαιώματα διαχειριστή. Νέα συντόμευση επιφάνειας εργασίας και Έναρξης. Η εγκατάσταση και η επόμενη αναβάθμιση αντικαθιστούν την προηγούμενη εγκατεστημένη έκδοση χωρίς απώλεια έργων, πηγαίων, ιστορικού ή αναφορών. Επιτυχείς πραγματικοί Windows CI έλεγχοι: πρόγραμμα, εγκατάσταση, λειτουργία γραφικού παραθύρου, επανεγκατάσταση, απεγκατάσταση και ακεραιότητα των δεδομένων. Οι παλιές φορητές λήψεις EXE δεν διαγράφονται αυτόματα." --prerelease
