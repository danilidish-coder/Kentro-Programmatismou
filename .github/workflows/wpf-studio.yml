name: WPF Studio Windows full validation and direct EXE
on:
  push:
    branches: [feature/wpf-pipeline-dashboard]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    name: WPF x64 GUI + Go integration and one-EXE verification
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.mod
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Go regression tests and build of unchanged engine
        run: |
          Push-Location source
          go test -count=1 ./... 2>&1 | Tee-Object ../wpf-engine-test.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          go vet ./...
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          New-Item -ItemType Directory -Force -Path ../publish | Out-Null
          go build -trimpath -o ../publish/Kentro_Engine.exe ./cmd/bridge
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location
          $v = & ./publish/Kentro_Engine.exe version | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $v.type -ne 'result'){throw 'Existing engine CLI smoke failed'}
      - name: Build self-contained WPF application with native Greek ClearType
        run: |
          dotnet publish wpf/Kentro.Wpf.csproj -c Release -r win-x64 --self-contained true --output publish 2>&1 | Tee-Object wpf-build.log
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          if(-not (Test-Path publish/Kentro_Programmatismou.exe)){throw 'WPF executable missing'}
          if(-not (Test-Path publish/Kentro_Engine.exe)){throw 'Embedded Go engine missing'}
      - name: Independent Go module regression and build gates
        run: |
          ./ci/studio-module-tests.ps1
      - name: Native WPF GUI end-to-end integration through actual UI controls
        run: |
          ./ci/wpf-ui-integration.ps1
      - name: Package WPF and Go engine inside one EXE
        run: |
          New-Item -ItemType Directory -Force source/cmd/onefile,single | Out-Null
          Compress-Archive -Path publish/* -DestinationPath source/cmd/onefile/payload.zip -CompressionLevel Optimal
          Copy-Item packaging/onefile-launcher.go.txt source/cmd/onefile/main.go
          Push-Location source
          go build -trimpath -ldflags '-s -w -H=windowsgui' -o ../single/Kentro_Programmatismou.exe ./cmd/onefile
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          Pop-Location
          $exe = 'single/Kentro_Programmatismou.exe'
          if(-not (Test-Path $exe) -or (Get-Item $exe).Length -lt 15000000){
            throw 'Single EXE not produced or payload incomplete'
          }
          "EXE_SHA256=$((Get-FileHash -Algorithm SHA256 $exe).Hash)" | Set-Content wpf-onefile.log
          "EXE_BYTES=$((Get-Item $exe).Length)" | Add-Content wpf-onefile.log
      - name: Validate standalone EXE launch, cached launch and clean exit
        run: |
          ./ci/studio-onefile-smoke.ps1
      - name: Preserve test reports and actual WPF screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpf-studio-diagnostics
          path: |
            wpf-engine-test.log
            wpf-build.log
            wpf-ui-integration.log
            wpf-screenshot.png
            wpf-onefile.log
            studio-onefile-smoke.log
            studio-modules.log
            wpf-crash.log
          if-no-files-found: warn
      - name: Publish direct standalone WPF EXE as test prerelease
        if: success() && github.ref == 'refs/heads/feature/wpf-pipeline-dashboard' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = "${{ github.sha }}".Substring(0,12)
          $tag = "wpf-pipeline-test-$sha"
          gh release create $tag "./single/Kentro_Programmatismou.exe" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Κέντρο Προγραμματισμού · WPF Pipeline $sha" --notes "Δοκιμαστική WPF Pipeline: προβολή σχεδίου ελέγχων, ιστορικό CI εκτελέσεων και διάγνωση αποτυχιών με logs. Ένα EXE χωρίς ZIP. Η προηγούμενη σταθερή έκδοση παραμένει ανέπαφη." --prerelease
