name: Windows validation and release candidate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Real Windows Go and Python GUI validation
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.mod
      - name: Run actual Windows unit, regression and safety tests
        working-directory: source
        run: |
          New-Item -ItemType Directory -Force -Path ../build | Out-Null
          go test -count=1 -v ./... 2>&1 | Tee-Object -FilePath ../build/windows-unit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller for synthetic CI project only
        run: |
          python -m pip install --disable-pip-version-check 'PyInstaller>=6.10,<7'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run real Python tests stress EXE build and GUI smoke
        working-directory: source
        run: |
          $env:KENTRO_RUN_PY_BUILD_TEST = '1'
          go test -count=1 -timeout 10m -run 'TestPythonBuildEndToEndWindows|TestEndToEndStagesAreSeparateOnWindows' -v ./engine 2>&1 | Tee-Object -FilePath ../build/windows-python-end-to-end.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build actual Windows application and Setup
        run: |
          Push-Location source
          go build -trimpath -ldflags '-H windowsgui -s -w' -o ../build/Kentro_Programmatismou.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Copy-Item build/Kentro_Programmatismou.exe installer/assets/Kentro_Programmatismou.exe -Force
          $env:GO111MODULE='off'; go build -trimpath -ldflags '-H windowsgui -s -w' -o build/Kentro_Programmatismou_Setup.exe ./installer/setup_windows.go
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/Kentro_Programmatismou_Setup.exe)) { throw 'Setup missing' }
      - name: Exercise native GUI and ZIP button crash regression
        shell: powershell
        run: .\ci\windows-smoke.ps1
      - name: Preserve reports even if the release gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kentro-test-reports
          path: |
            build/windows-unit.log
            build/windows-python-end-to-end.log
            build/windows-ui-smoke.log
          if-no-files-found: warn
      - name: Publish EXE and Setup only if every required check passed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: kentro-verified-windows-exe-setup
          path: |
            build/Kentro_Programmatismou.exe
            build/Kentro_Programmatismou_Setup.exe
            build/windows-unit.log
            build/windows-python-end-to-end.log
            build/windows-ui-smoke.log
          if-no-files-found: error
